name: Validate Studio browser image
'on':
  push:
    branches:
    - fix/studio-e2e-browser-image
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: .github
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Create browser test project
      run: 'mkdir -p studio

        printf ''%s\n'' ''{"private":true,"packageManager":"pnpm@11.7.0","devDependencies":{"@playwright/test":"1.62.1","better-sqlite3":"13.0.3"}}''
        > studio/package.json

        printf ''allowBuilds:\n  better-sqlite3: true\n'' > studio/pnpm-workspace.yaml'
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: studio/package.json
        run_install: false
    - name: Install test dependencies
      working-directory: studio
      run: 'pnpm install --no-frozen-lockfile

        node -e ''const Database=require("better-sqlite3");const db=new Database(":memory:");console.log(db.prepare("select
        1 as ok").get());db.close();''

        ../.github/nocobase3/run-studio-browser.sh "$PWD" pnpm exec node -e ''const
        Database=require("better-sqlite3");const db=new Database(":memory:");console.log(db.prepare("select
        1 as ok").get());db.close();'''
    - name: Verify Chromium
      timeout-minutes: 5
      working-directory: studio
      run: "../.github/nocobase3/run-studio-browser.sh \"$PWD\" node --input-type=module\
        \ <<'NODE'\nimport { chromium } from '@playwright/test';\nconst browser =\
        \ await chromium.launch();\ntry {\n  const page = await browser.newPage();\n\
        \  await page.setContent('<title>Studio browser check</title>');\n  if (await\
        \ page.title() !== 'Studio browser check') throw new Error('Chromium check\
        \ failed');\n  console.log(`Chromium ${browser.version()} is ready`);\n} finally\
        \ {\n  await browser.close();\n}\nNODE\n"
    - name: Verify runner tools and workflow contracts
      run: 'node --version

        pnpm --version

        jq --version

        git --version

        zstd --version

        node --test .github/nocobase3/tests/studio-quality-contract.test.mjs .github/nocobase3/tests/framework-packages.test.mjs'
